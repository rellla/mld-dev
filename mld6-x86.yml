header:
  version: 8


machine: genericx86-64
distro: mld
target:
  - mld-image-boot

repos:
  meta-mld:
    url: https://gitlab.com/MLD-6/meta-mld.git
    refspec: gatesgarth 

  poky:
    url: https://git.yoctoproject.org/git/poky
    refspec: hardknott
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: http://git.openembedded.org/meta-openembedded
    refspec: hardknott
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-perl:
      meta-multimedia:

bblayers_conf_header:
  standard: |
    POKY_BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""
    #PRSERV_HOST = "127.0.0.1:8888"
    #PRSERV_HOST = "127.0.0.1:5678"
local_conf_header:
  prserv: |
    INHERIT += "buildhistory"
    BUILDHISTORY_COMMIT = "1"
  reduce_diskspace: |
    INHERIT += "rm_work_and_downloads"
  standard: |
    CONF_VERSION = "1"
    PACKAGE_CLASSES ?= "package_deb"
    EXTRA_IMAGE_FEATURES += " package-management "
    PACKAGE_FEED_URIS = "http://81.169.232.251:5678"
    SDKMACHINE = "x86_64"
    #USER_CLASSES = "buildstats image-mklibs image-prelink"
    PATCHRESOLVE = "noop"
    #PREFERRED_VERSION_linux-yocto ?= "5.12.%"
    PREFERRED_VERSION_linux-mainline ?= "5.12%"
    IMAGE_FSTYPES = "hddimg"
    IMAGE_FSTYPES += "iso"
    IMAGE_FSTYPES += "wic.vmdk"
    IMAGE_FSTYPES += "wic.vdi"
    LICENSE_FLAGS_WHITELIST = "commercial"
    DISTRO_FEATURES:append = " systemd"
    DISTRO_FEATURES:append = " x11"
    DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
    VIRTUAL-RUNTIME_init_manager = "systemd"
    VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"  
    DISTRO_FEATURES:append = " opengl"
  debug-tweaks: |
    EXTRA_IMAGE_FEATURES = "debug-tweaks"
  diskmon: |
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        ABORT,${TMPDIR},100M,1K \
        ABORT,${DL_DIR},100M,1K \
        ABORT,${SSTATE_DIR},100M,1K \
        ABORT,/tmp,10M,1K" 