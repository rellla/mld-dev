header:
  version: 9
  includes: 
    - install.yml

machine: genericx86-64

local_conf_header:
  plattform: |
    IMAGE_FSTYPES += "iso"
    INITRAMFS_FSTYPES = "cpio.lzma"
    LIVE_ROOTFS_TYPE = "squashfs"
    APPEND += "ro"
#    PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto-dev"

  bootloader: |
    SYSLINUX_SERIAL = ""
    SYSLINUX_SPLASH = "${TOPDIR}/../meta-mld/files/splash.png"
    SYSLINUX_OPTS = "menu RESOLUTION 800 600;menu WIDTH 28;menu MARGIN 1;menu ROWS 6;menu HSHIFT 35;menu VSHIFT 19;menu TABMSGROW -1;menu CMDLINEROW -1;menu TIMEOUTROW 20;menu CLEAR;menu HIDDEN;menu color screen * #00ffffff #00ffffff none;menu color border * #00ffffff #00ffffff none;menu color title * #00ffffff #00ffffff none;menu color unsel * #88ffffff #00ffffff none;menu color sel * #ffffffff #ffc00000 none;menu color disabled * #09ffffff #00ffffff none;menu color tabmsg * #09ffffff #00ffffff none;menu color cmdline * #88ffffff #00ffffff none;menu color timeout * #09ffffff #00ffffff none;menu color timeout_msg * #09ffffff #00ffffff none"
    GRUB_SERIAL = ""
    GRUB_TIMEOUT = "5"
    #GRUB_OPTS = "menu_color_highlight=white/red;color_normal=black/black"

  # for p in $(wget "http://www.minidvblinux.de/site/show_landriver.php?list" -q -O -); do apt list 2>/dev/null | grep -q kernel-module-$p-[0-9] && echo -n "kernel-module-$p "; done
  networking: |
    CORE_IMAGE_EXTRA_INSTALL += "kernel-module-8139too kernel-module-alx kernel-module-asix kernel-module-ath9k kernel-module-atl1 kernel-module-atl1c kernel-module-atl1e kernel-module-atl2 kernel-module-jme kernel-module-pcnet32 kernel-module-r8169 kernel-module-realtek kernel-module-rt2800pci kernel-module-skge kernel-module-sky2 kernel-module-tg3"

  packages: |
    #CORE_IMAGE_EXTRA_INSTALL += "xf86-video-fbdev"
