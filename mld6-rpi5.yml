header:
  version: 10
  includes:
    - install.yml
    - docker.yml
    
machine: raspberrypi5

repos:
  meta-mld:
    url: https://gitlab.com/MLD-6/meta-mld.git
    branch: scarthgap
    layers:
      meta-raspberry:

  meta-raspberry:
    url: https://git.yoctoproject.org/git/meta-raspberrypi
    branch: scarthgap
    commit: 3b27c95c163a042f8056066ec3d27edfcc42da7f

local_conf_header:
  plattform: |
    #PREFERRED_VERSION_linux-raspberrypi ?= "5.10.%"
    #PREFERRED_PROVIDER_virtual/kernel ?= "linux-raspberrypi-dev"
    PREFERRED_PROVIDER_vlc = "vlc"
    
    IMAGE_FSTYPES = "rpi-sdimg"
    SDIMG_ROOTFS_TYPE = "squashfs"
    INITRAMFS_IMAGE = "core-image-minimal-initramfs"

    #VC4DTBO ?= "vc4-kms-v3d-pi4"
    #VC4DTBO ?= "vc4-fkms-v3d"
    VC4DTBO ?= "vc4-kms-v3d"
    GPU_MEM ?= "320"
    MACHINE_FEATURES += "vc4graphics"
    #ENABLE_I2C = "1"
    DISABLE_OVERSCAN = "1"

    RPI_EXTRA_CONFIG = "\
    dtoverlay=rpivid-v4l2 \n\
    dtoverlay=gpio-ir \n\
    dtparam=audio=on \n\
    "
    
  bootloader: |
    # RPI_USE_U_BOOT = "1"
    # INITRAMFS_FSTYPES:append = ".u-boot"
    # DEPLOYPAYLOAD += "splash.bmp"

  extra: |
    #CORE_IMAGE_EXTRA_INSTALL += "kernel-modules"
    #PREFERRED_VERSION_imagemagick = "6.%"
    #USER_CLASSES = "buildstats image-mklibs image-prelink"
    PREFERRED_PROVIDER_vlc = "vlc"

  networking: |
    CORE_IMAGE_EXTRA_INSTALL += "linux-firmware-bcm43455"
