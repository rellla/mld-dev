header:
  version: 9
  includes: 
    - install.yml
    - docker.yml
#    - chromium.yml
#    - firefox.yml

machine: genericx86-64

repos:
  meta-intel:
    url: git://git.yoctoproject.org/meta-intel
    branch: kirkstone 

  meta-java:
    url: git://git.yoctoproject.org/meta-java
    branch: kirkstone

local_conf_header:
  plattform: |
    IMAGE_FSTYPES += "iso"
    PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"

  xorg: |
    CORE_IMAGE_EXTRA_INSTALL += "xorg-driver-detect kmod-8168 linux-firmware-rtl8168"

  # for p in $(wget "http://www.minidvblinux.de/site/show_landriver.php?list" -q -O -); do apt list 2>/dev/null | grep -q kernel-module-$p-[0-9] && echo -n "kernel-module-$p "; done
  networking: |
    # CORE_IMAGE_EXTRA_INSTALL += "kernel-module-8139too kernel-module-alx kernel-module-asix kernel-module-ath9k kernel-module-atl1 kernel-module-atl1c kernel-module-atl1e kernel-module-atl2 kernel-module-jme kernel-module-pcnet32 kernel-module-r8169 kernel-module-realtek kernel-module-rt2800pci kernel-module-skge kernel-module-sky2 kernel-module-tg3"

  extra: |
    CORE_IMAGE_EXTRA_INSTALL += "setserial"
