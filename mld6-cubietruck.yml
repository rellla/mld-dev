header:
  version: 9
  includes: 
    - base.yml

machine: cubietruck

target:
  - mld-image-netinstall

repos:
  meta-sunxi:
    url: https://github.com/linux-sunxi/meta-sunxi.git
    refspec: hardknott

  meta-qt5:
    url: https://github.com/meta-qt5/meta-qt5/
    refspec: hardknott

local_conf_header:
  plattform: |
    USER_CLASSES = "buildstats image-mklibs image-prelink"
    #PREFERRED_VERSION_linux-mainline ?= "5.4%"
    PREFERRED_VERSION_linux-mainline ?= "5.10%"
