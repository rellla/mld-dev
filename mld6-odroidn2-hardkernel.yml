header:
  version: 9
  includes: 
    - install.yml
    - docker.yml

machine: hardkernel-odroidn2plus

repos:
  meta-meson:
     url: https://github.com/superna9999/meta-meson.git
     branch: kirkstone
  
  meta-mld:
    url: https://gitlab.com/MLD-6/meta-mld.git
    branch: kirkstone
    layers:
      meta-raspberry:

  meta-raspberry:
    url: https://git.yoctoproject.org/git/meta-raspberrypi
    branch: kirkstone

                  
local_conf_header:
  plattform: |
    USE_BOOTSRC = "0"
    IMAGE_FSTYPES = "ext4 wic.bz2"
    MACHINE_FEATURES += "emmc"
    MACHINE_FEATURES += "lima"
    DISTRO_FEATURES += "x11"
