header:
  version: 8

machine: raspberrypi2
distro: mld

target:
  - mld-image-test

repos:

  meta-mld:
    url: https://github.com/rofehr/meta-mld.git
    refspec: zeus 

  meta-raspberry:
    url: https://git.yoctoproject.org/git/meta-raspberrypi
    refspec: zeus

  poky:
    url: https://git.yoctoproject.org/git/poky
    refspec: zeus
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: http://git.openembedded.org/meta-openembedded
    refspec: zeus
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-perl:


bblayers_conf_header:
  standard: |
    POKY_BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""
    PRSERV_HOST = "localhost:0"
local_conf_header:
  reduce_diskspace: |
    INHERIT += "rm_work_and_downloads"
  standard: |
    CONF_VERSION = "1"
    PACKAGE_CLASSES = "package_deb"
    EXTRA_IMAGE_FEATURES += " package-management ssh-server-openssh"
    #PACKAGE_FEED_URIS = "http://<local-machine-ip>:5678"
    SDKMACHINE = "x86_64"
    USER_CLASSES = "buildstats image-mklibs image-prelink"
    PATCHRESOLVE = "noop"
    PREFERRED_VERSION_linux-raspberrypi = "5.4.%"
    PREFERRED_VERSION_gstreamer = "1.16.%"
    LICENSE_FLAGS_WHITELIST = "commercial"
    MACHINE_FEATURES += "vc4graphics"
    INHERIT += "extrausers"
    EXTRA_USERS_PARAMS = "usermod -P mld600 root;"
    SPLASH = "psplash"
    DISABLE_SPLASH = "1"
    DISTRO_FEATURES_append = " systemd"
    DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
    VIRTUAL-RUNTIME_init_manager = "systemd"
    VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"    
  debug-tweaks: |
    EXTRA_IMAGE_FEATURES = "debug-tweaks"
  diskmon: |
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        ABORT,${TMPDIR},100M,1K \
        ABORT,${DL_DIR},100M,1K \
        ABORT,${SSTATE_DIR},100M,1K \
        ABORT,/tmp,10M,1K"

        
