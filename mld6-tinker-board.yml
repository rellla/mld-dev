header:
  version: 9
  includes: 
    - install.yml
    - docker.yml

machine: tinker-board

repos:
  meta-arm:
    url: git://git.yoctoproject.org/meta-arm
    branch: kirkstone
    layers:
      meta-arm:
      meta-arm-toolchain:
      meta-arm-bsp:

  meta-rockchip:
     url: git://git.yoctoproject.org/meta-rockchip
     branch: kirkstone

  meta-mld:
    url: https://gitlab.com/MLD-6/meta-mld.git
    branch: kirkstone
    layers:
      meta:
      meta-arm:
            
local_conf_header:
