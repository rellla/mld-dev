header:
  version: 9
  includes: 
    - install.yml

machine: cubietruck

repos:
  meta-sunxi:
    url: https://github.com/linux-sunxi/meta-sunxi.git
    branch: scarthgap

  meta-qt5:
    url: https://github.com/meta-qt5/meta-qt5/
    branch: scarthgap

  meta-arm:
    url: https://git.yoctoproject.org/meta-arm
    branch: scarthgap
    layers:
        meta-arm:
        meta-arm-bsp:
        meta-arm-systemready:
        meta-arm-toolchain:

local_conf_header:
  machine: |
    DISTRO_FEATURES:append = " opengl"
  plattform: |
    USER_CLASSES = " buildstats"
    #PREFERRED_VERSION_linux-mainline ?= "5.4%"
    #PREFERRED_VERSION_linux-sunxi ?= "3.4%"
