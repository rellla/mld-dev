header:
  version: 8

machine: cubietruck
distro: mld
target:
  - mld-image-test

repos:

  meta-mld:
    url: https://gitlab.com/rofehr/meta-mld.git
    refspec: zeus 

  meta-sunxi:
    url: https://github.com/linux-sunxi/meta-sunxi.git
    refspec: zeus

  poky:
    url: https://git.yoctoproject.org/git/poky
    refspec: zeus
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: http://git.openembedded.org/meta-openembedded
    refspec: zeus
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-perl:

bblayers_conf_header:
  standard: |
    POKY_BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""
    #PRSERV_HOST = "127.0.0.1:8888"
local_conf_header:
  prserv: |
    INHERIT += "buildhistory"
    BUILDHISTORY_COMMIT = "1"
  reduce_diskspace: |
    INHERIT += "rm_work_and_downloads"
  standard: |
    CONF_VERSION = "1"
    PACKAGE_CLASSES = "package_deb"
    EXTRA_IMAGE_FEATURES += " package-management ssh-server-openssh"
    #PACKAGE_FEED_URIS = "http://<local-machine-ip>:5678"
    SDKMACHINE = "x86_64"
    USER_CLASSES = "buildstats image-mklibs image-prelink"
    PATCHRESOLVE = "noop"
    PREFERRED_VERSION_linux-raspberrypi ?= "5.4.%"
    LICENSE_FLAGS_WHITELIST = "commercial"
  debug-tweaks: |
    EXTRA_IMAGE_FEATURES = "debug-tweaks"
  diskmon: |
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        ABORT,${TMPDIR},100M,1K \
        ABORT,${DL_DIR},100M,1K \
        ABORT,${SSTATE_DIR},100M,1K \
        ABORT,/tmp,10M,1K"
        