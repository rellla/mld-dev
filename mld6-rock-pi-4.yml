header:
  version: 9
  includes: 
    - install.yml

machine: rock-pi-4b

repos:
  meta-arm:
    url: git://git.yoctoproject.org/meta-arm
    refspec: hardknott
    layers:
      meta-arm:
      meta-arm-toolchain:
      meta-arm-bsp:

  meta-rockchip:
     url: git://git.yoctoproject.org/meta-rockchip
     refspec: hardknott
     #url: https://github.com/rockchip-linux/meta-rockchip.git
     #refspec: yocto-next

  meta-mld:
    url: https://gitlab.com/MLD-6/meta-mld.git
    refspec: gatesgarth
    layers:
      meta-raspberry:
      
local_conf_header:
  plattform: |
    USER_CLASSES = "buildstats image-mklibs image-prelink"
    #PREFERRED_VERSION_linux-yocto = "5.15%"
    PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto-dev"
