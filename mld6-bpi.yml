header:
  version: 9
  includes: 
    - install.yml
    
machine: bananapi

repos:
  meta-sunxi:
    url: https://github.com/linux-sunxi/meta-sunxi.git
    branch: scarthgap

  meta-arm:
    url: https://git.yoctoproject.org/meta-arm
    branch: scarthgap
    layers:
        meta-arm:
        meta-arm-bsp:
        meta-arm-systemready:
        meta-arm-toolchain:

local_conf_header:
  plattform: |
    #USER_CLASSES = " buildstats"
    #PREFERRED_VERSION_linux-mainline ?= "5.15%"

  extra: |
    #Provide 1 Gb extra disk space for testing purposes
    IMAGE_ROOTFS_EXTRA_SPACE = "1048576"
