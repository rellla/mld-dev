header:
  version: 9
  includes: 
    - base.yml

machine: rock-pi-4b

target:
  - core-image-minimal 
  - mld-image-rpi-drm
  - mld-image-boot
  - mld-image-netinstall

repos:
  meta-arm:
    url: git://git.yoctoproject.org/meta-arm
    refspec: hardknott
    layers:
      meta-arm:
      meta-arm-toolchain:
      meta-arm-bsp:

  meta-rockchip:
     url: git://git.yoctoproject.org/meta-rockchip
     refspec: hardknott
     #url: https://github.com/rockchip-linux/meta-rockchip.git
     #refspec: yocto-next

local_conf_header:
  plattform: |
    USER_CLASSES = "buildstats image-mklibs image-prelink"
    #PREFERRED_VERSION_linux-yocto = "5.15%"
    PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto-dev"
    DISTRO_FEATURES += "x11 opengl"
