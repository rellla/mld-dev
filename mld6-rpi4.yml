header:
  version: 10
  includes:
    - install.yml
    
machine: raspberrypi4

repos:
  meta-mld:
    url: https://gitlab.com/MLD-6/meta-mld.git
    refspec: gatesgarth
    layers:
      meta-raspberry:

  meta-raspberry:
    url: https://git.yoctoproject.org/git/meta-raspberrypi
    refspec: hardknott

local_conf_header:
  plattform: |
    #PREFERRED_VERSION_linux-raspberrypi ?= "5.10.%"
    #PREFERRED_PROVIDER_virtual/kernel ?= "linux-raspberrypi-dev"

    IMAGE_FSTYPES = "rpi-sdimg"
    SDIMG_ROOTFS_TYPE = "squashfs"
    INITRAMFS_IMAGE = "core-image-minimal-initramfs"

    #VC4DTBO ?= "vc4-kms-v3d-pi4"
    VC4DTBO ?= "vc4-fkms-v3d"
    GPU_MEM ?= "320"
    MACHINE_FEATURES += "vc4graphics"

    #ENABLE_I2C = "1"

  bootloader: |
    #INITRAMFS_IMAGE_BUNDLE = "1"
    #RPI_USE_U_BOOT = "1"

  extra: |
    #CORE_IMAGE_EXTRA_INSTALL += "kernel-modules"
    #PREFERRED_VERSION_imagemagick = "6.%"
    #USER_CLASSES = "buildstats image-mklibs image-prelink"
