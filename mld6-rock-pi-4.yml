header:
  version: 8
  includes: 
    - base.yml
    - systemd.yml
 
machine: rock-pi-4b

distro: mld
target:
  - core-image-minimal 
  - mld-image-rpi-drm
  - mld-image-boot
  - mld-image-netinstall
  
repos:

  meta-mld:
    url: https://gitlab.com/MLD-6/meta-mld.git
    refspec: gatesgarth 
  
  meta-arm:
    url: git://git.yoctoproject.org/meta-arm
    refspec: hardknott
    layers:
      meta-arm:
      meta-arm-toolchain:
      meta-arm-bsp:
      
  meta-rockchip:
     url: git://git.yoctoproject.org/meta-rockchip
     refspec: hardknott
     #url: https://github.com/rockchip-linux/meta-rockchip.git
     #refspec: yocto-next
                                            
  poky:
    url: https://git.yoctoproject.org/git/poky
    refspec: hardknott
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: http://git.openembedded.org/meta-openembedded
    refspec: hardknott
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-perl:
      meta-multimedia:
      meta-initramfs:
      

bblayers_conf_header:
  standard: |
    POKY_BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""
    #PRSERV_HOST = "127.0.0.1:8888"
    #PRSERV_HOST = "127.0.0.1:5678"    
local_conf_header:
  prserv: |
    INHERIT += "buildhistory"
    BUILDHISTORY_COMMIT = "1"
  standard: |
    CONF_VERSION = "1"
    PACKAGE_CLASSES = "package_deb"
    EXTRA_IMAGE_FEATURES += " package-management "
    PACKAGE_FEED_URIS = "http://81.169.232.251:5678"   
    SDKMACHINE = "x86_64"
    USER_CLASSES = "buildstats image-mklibs image-prelink"
    PATCHRESOLVE = "noop"
    PREFERRED_VERSION_linux-yocto = "5.10%"
    LICENSE_FLAGS_WHITELIST = "commercial"
    DISTRO_FEATURES:append = " x11 opengl"
  debug-tweaks: |
    EXTRA_IMAGE_FEATURES = "debug-tweaks"
  diskmon: |
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        ABORT,${TMPDIR},100M,1K \
        ABORT,${DL_DIR},100M,1K \
        ABORT,${SSTATE_DIR},100M,1K \
        ABORT,/tmp,10M,1K"
        
