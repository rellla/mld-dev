header:
  version: 8
  includes: 
    - base.yml
    - systemd.yml
    
machine: raspberrypi4
distro: mld
target:
  - mld-image-boot

repos:

  meta-mld:
    url: https://gitlab.com/MLD-6/meta-mld.git
    refspec: gatesgarth 

  meta-raspberry:
    url: https://git.yoctoproject.org/git/meta-raspberrypi
    refspec: hardknott

  poky:
    url: https://git.yoctoproject.org/git/poky
    refspec: hardknott
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: http://git.openembedded.org/meta-openembedded
    refspec: hardknott
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-perl:
      meta-multimedia:
      meta-initramfs:


bblayers_conf_header:
  standard: |
    POKY_BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""
    #PRSERV_HOST = "127.0.0.1:5678"
local_conf_header:
  prserv: |
    INHERIT += "buildhistory"
    BUILDHISTORY_COMMIT = "1"
  standard: |
    CONF_VERSION = "1"
    PACKAGE_CLASSES = "package_deb"
    EXTRA_IMAGE_FEATURES += " package-management "
    PACKAGE_FEED_URIS = "http://81.169.232.251:5678"
    SDKMACHINE = "x86_64"
    #USER_CLASSES = "buildstats image-mklibs image-prelink"
    PATCHRESOLVE = "noop"
    #PREFERRED_VERSION_linux-raspberrypi ?= "5.10.%"
    #PREFERRED_VERSION_linux-mainline ?= "5.10%"
    PREFERRED_PROVIDER_virtual/kernel ?= "linux-raspberrypi-dev"
    VC4DTBO ?= "vc4-kms-v3d-pi4"
    #VC4DTBO ?= "vc4-fkms-v3d"
    LICENSE_FLAGS_WHITELIST = "commercial"
    GPU_MEM ?= "512"
    DISTRO_FEATURES:append = "x11 opengl"
    PREFERRED_VERSION_imagemagick = "6.%"
    MACHINE_FEATURES += "vc4graphics"

    #BOOT_SPACE = "1073741"
    #INITRAMFS_MAXSIZE = "315400"
    #IMAGE_FSTYPES = "btrfs"
    #IMAGE_FSTYPES_append = " live"
    #NOISO = "0"
    #INITRAMFS_IMAGE = "image-minimal-initramfs"
    #INITRAMFS_IMAGE_BUNDLE = "1"

  extra: |
    #RPI_USE_U_BOOT = "1"  
  debug-tweaks: |
    EXTRA_IMAGE_FEATURES = "debug-tweaks"
    #EXTRA_IMAGE_FEATURES_append = " dbg-pkgs"
    
  diskmon: |
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        ABORT,${TMPDIR},100M,1K \
        ABORT,${DL_DIR},100M,1K \
        ABORT,${SSTATE_DIR},100M,1K \
        ABORT,/tmp,10M,1K"
        
